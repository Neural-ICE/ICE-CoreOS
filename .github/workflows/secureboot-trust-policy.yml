name: secureboot-trust-policy

on:
  pull_request:
    paths:
      - "secureboot/trust-policies/**"
      - ".github/workflows/secureboot-trust-policy.yml"
  push:
    branches: [main]
    paths:
      - "secureboot/trust-policies/**"
      - ".github/workflows/secureboot-trust-policy.yml"

permissions:
  contents: read

jobs:
  policy:
    # This job runs on a GitHub-hosted runner, so a fork's code never touches
    # Neural ICE infrastructure. The guard that used to skip fork pull requests
    # entirely is therefore removed: on an open-core repository it did not just
    # contain a risk, it denied external contributions any CI at all.
    # `pull_request` from a fork gets a read-only token and no secrets.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Validate shell syntax and lint
        run: |
          bash -n secureboot/trust-policies/neural-ice-secureboot-lab-v1
          bash -n secureboot/trust-policies/test-neural-ice-secureboot-lab-v1.sh
          shellcheck secureboot/trust-policies/neural-ice-secureboot-lab-v1 \
            secureboot/trust-policies/test-neural-ice-secureboot-lab-v1.sh
      - name: Run the LAB trust-policy negative suite
        run: ./secureboot/trust-policies/test-neural-ice-secureboot-lab-v1.sh
