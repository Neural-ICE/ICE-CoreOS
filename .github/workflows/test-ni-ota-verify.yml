name: test-ni-ota-verify

# Same-repository gate for the on-device OTA verifier (tools/ni-ota-verify —
# ICE-Fabric OTA signing plan P2): fmt + clippy + tests on the
# organization-owned x86_64 and ARM64 pools. The toolchain runs inside the same
# digest-pinned Rust image used by the bootc build, so runners stay toolchain-free.
# The test-path-overrides build stubs cosign via NI_OTA_COSIGN, so no signing
# infrastructure is needed here; the default build is tested too, and its release
# binary must not even contain that name. Persistent self-hosted runners never execute pull_request-controlled
# workflow definitions. Only the protected main ref may schedule these jobs;
# workflow_dispatch is guarded at the job boundary as defense in depth.

on:
  push:
    branches:
      - main
    paths:
      - 'tools/ni-ota-verify/**'
      - 'ci/test-open-core-boundary.sh'
      - '.github/workflows/test-ni-ota-verify.yml'
  pull_request:
    paths:
      - 'tools/ni-ota-verify/**'
      - 'ci/test-open-core-boundary.sh'
      - '.github/workflows/test-ni-ota-verify.yml'
  workflow_dispatch:

concurrency:
  group: test-ni-ota-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run the SAME checks on a GitHub-hosted runner.
  #
  # The self-hosted jobs below stay main-only on purpose: a pull request can edit
  # the workflow definition itself, and a persistent runner would then execute
  # author-controlled commands on Neural ICE infrastructure. That control is not
  # relaxed here — it is respected by sending pull requests somewhere disposable.
  #
  # Until this existed, the verifier that decides whether an appliance accepts an
  # update was only tested AFTER merge. A defect reached main before anyone could
  # see it, and on an open-core repository external contributions had no CI at all.
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_IMAGE: docker.io/library/rust:1.93-bookworm@sha256:7c4ae649a84014c467d79319bbf17ce2632ae8b8be123ac2fb2ea5be46823f31
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Enforce the open-core boundary
        run: ./ci/test-open-core-boundary.sh

      - name: Verify, lint and test in the pinned Rust toolchain
        env:
          # NEUTRAL and deliberately wrong: the suite must prove the contract, not
          # the identity of a deployment. The real authority comes from the
          # repository configuration at image build time.
          NI_TRUSTED_TIME_ISSUER: trusted-time.example.test
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src/tools/ni-ota-verify \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e NI_TRUSTED_TIME_ISSUER \
            "$RUST_IMAGE" \
            bash -euo pipefail -c '
              rustup component add rustfmt clippy
              cargo fmt --check
              cargo clippy --all-targets --all-features --locked -- -D warnings
              cargo build --release --locked
              ! grep -a -q NI_OTA_HARDWARE_TARGET_FILE /tmp/target/release/ni-ota-verify
              ! grep -a -q NI_OTA_COSIGN /tmp/target/release/ni-ota-verify
              # 🔴 THE SUITES RUN UNPRIVILEGED. The cosign test seam refuses a
              # root process (review 2026-09-02, P1), exactly as it must on an
              # appliance, so the container root that installed the toolchain
              # hands the tests to a plain user. Every crate was fetched by the
              # build above; the test user only reads that cache.
              useradd --create-home ci
              chown -R ci /tmp/target /tmp/cargo-home
              run_tests() {
                runuser -u ci -- env HOME=/home/ci PATH="$PATH" RUSTUP_HOME="$RUSTUP_HOME" \
                  CARGO_HOME=/tmp/cargo-home CARGO_TARGET_DIR=/tmp/target \
                  NI_TRUSTED_TIME_ISSUER="$NI_TRUSTED_TIME_ISSUER" "$@"
              }
              run_tests cargo test --locked --features test-path-overrides
              # The build the OS image ships: no seam is compiled in, and the
              # unit tests that only exist there prove the environment is ignored.
              run_tests cargo test --locked
            '

  linux-x86_64:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      RUST_IMAGE: docker.io/library/rust:1.93-bookworm@sha256:7c4ae649a84014c467d79319bbf17ce2632ae8b8be123ac2fb2ea5be46823f31
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify, lint and test in pinned Rust toolchain
        run: |
          set -euo pipefail
          # Root inside rootless Podman maps to the runner user, so rustup may add
          # components to the image toolchain while generated files stay user-owned.
          podman run --rm \
            -v "$PWD:/src:Z" \
            -w /src/tools/ni-ota-verify \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target \
            "$RUST_IMAGE" \
            bash -euo pipefail -c '
              rustup component add rustfmt clippy
              cargo fmt --check
              cargo clippy --all-targets --all-features --locked -- -D warnings
              cargo build --release --locked
              ! grep -a -q NI_OTA_HARDWARE_TARGET_FILE /tmp/target/release/ni-ota-verify
              ! grep -a -q NI_OTA_COSIGN /tmp/target/release/ni-ota-verify
              # 🔴 THE SUITES RUN UNPRIVILEGED: the cosign test seam refuses a
              # root process (review 2026-09-02, P1). Build directories live
              # inside the container, so nothing the test user writes reaches
              # the bind mount. Valeur NEUTRE et volontairement fausse pour
              # l emetteur de temps : la suite doit prouver le contrat, pas
              # l identite du deploiement.
              useradd --create-home ci
              chown -R ci /tmp/target /tmp/cargo-home
              run_tests() {
                runuser -u ci -- env HOME=/home/ci PATH="$PATH" RUSTUP_HOME="$RUSTUP_HOME" \
                  CARGO_HOME=/tmp/cargo-home CARGO_TARGET_DIR=/tmp/target \
                  NI_TRUSTED_TIME_ISSUER=trusted-time.example.test "$@"
              }
              run_tests cargo test --locked --features test-path-overrides
              run_tests cargo test --locked
            '

      - name: Cleanup build tree
        if: always()
        run: rm -rf tools/ni-ota-verify/target .cargo-ci

  linux-arm64:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      RUST_IMAGE: docker.io/library/rust:1.93-bookworm@sha256:7c4ae649a84014c467d79319bbf17ce2632ae8b8be123ac2fb2ea5be46823f31
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify, lint and test in pinned Rust toolchain
        run: |
          set -euo pipefail
          podman run --rm \
            -v "$PWD:/src:Z" \
            -w /src/tools/ni-ota-verify \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target \
            "$RUST_IMAGE" \
            bash -euo pipefail -c '
              rustup component add rustfmt clippy
              cargo fmt --check
              cargo clippy --all-targets --all-features --locked -- -D warnings
              cargo build --release --locked
              ! grep -a -q NI_OTA_HARDWARE_TARGET_FILE /tmp/target/release/ni-ota-verify
              ! grep -a -q NI_OTA_COSIGN /tmp/target/release/ni-ota-verify
              # 🔴 THE SUITES RUN UNPRIVILEGED: the cosign test seam refuses a
              # root process (review 2026-09-02, P1). Build directories live
              # inside the container, so nothing the test user writes reaches
              # the bind mount. Valeur NEUTRE et volontairement fausse pour
              # l emetteur de temps : la suite doit prouver le contrat, pas
              # l identite du deploiement.
              useradd --create-home ci
              chown -R ci /tmp/target /tmp/cargo-home
              run_tests() {
                runuser -u ci -- env HOME=/home/ci PATH="$PATH" RUSTUP_HOME="$RUSTUP_HOME" \
                  CARGO_HOME=/tmp/cargo-home CARGO_TARGET_DIR=/tmp/target \
                  NI_TRUSTED_TIME_ISSUER=trusted-time.example.test "$@"
              }
              run_tests cargo test --locked --features test-path-overrides
              run_tests cargo test --locked
            '

      - name: Cleanup build tree
        if: always()
        run: rm -rf tools/ni-ota-verify/target .cargo-ci
