name: test-artifact-generation

on:
  pull_request:
    paths:
      - "ci/artifact-generation.sh"
      - "ci/canonicalize-vmlinuz.sh"
      - "ci/stage-artifacts.sh"
      - "ci/stage-nvidia-userspace.sh"
      - "ci/test-artifact-generation.sh"
      - "ci/test-stage-nvidia-userspace.sh"
      - "ci/build-image.sh"
      # The two files that decide whether an appliance installs at all were
      # covered by NO pull-request check: three defects shipped through them on
      # 2026-08-19 and CI never looked. Adding them here is the cheapest gate
      # that exists — the media build is the real test, but it costs 20 minutes
      # and a build host, so it cannot be the FIRST thing that notices.
      - "image/Containerfile.installer"
      - "image/installer/**"
      - "image/test-installer-systemd-lifecycle.sh"
      - "image/build-installer-usb.sh"
      - "image/lib/installer-ssh-key.sh"
      - "image/lib/access-policy.sh"
      # The P0 installer trust architecture (docs/ADR-0015): the sealed UKI
      # anchor, the release authorization and the install-time access-profile
      # anchor. These three decide whether an appliance installs the image it
      # was authorised to install, so they get the same cheap pull-request gate
      # as the installer files above -- the media build is the real test, but it
      # costs 20 minutes and a build host and cannot be the FIRST thing to notice.
      - "image/lib/installer-trust.sh"
      - "image/lib/release-authorization.sh"
      - "image/lib/hardware-identity.sh"
      - "image/lib/signing-trust.sh"
      - "image/build-installer-uki.sh"
      - "image/build-installer-root.sh"
      - "image/build-installer-payload.sh"
      - "image/lib/installer-payload.sh"
      - "image/inspect-installer-media.py"
      - "image/initramfs/**"
      - "image/hardware-identity/**"
      - "image/test-access-policy.sh"
      - "image/test-installer-trust.sh"
      - "image/test-installer-uki.sh"
      - "image/test-installer-media.sh"
      - "image/test-lib/**"
      - "image/test-build-installer-root.sh"
      - "image/test-installer-payload.sh"
      - "image/test-hardware-identity.sh"
      - "image/test-signing-trust.sh"
      - "image/test-release-authorization.sh"
      - "ota/neural-ice-access-profile-anchor.sh"
      - "ota/test-neural-ice-access-profile-anchor.sh"
      - "ota/neural-ice-tpm-state.sh"
      - "ota/test-neural-ice-tpm-state.sh"
      - "ota/neural-ice-autoinstall.sh"
      - "ota/neural-ice-autoinstall.service"
      - "ota/test-autoinstall-kargs.sh"
      - "ci/test-build-image-dispatch-contract.sh"
      - "ci/test-open-core-boundary.sh"
      - "ci/test-oci-signature-policy.sh"
      - "ci/test-no-shim-chained-updater.sh"
      - "secureboot/shim-review-answers.draft.md"
      - "image/policy/render-container-policy.sh"
      - "image/bootc-overlay/**"
      - "image/build-preloaded.sh"
      - "image/build-installer-usb.sh"
      - "image/Containerfile.bootc"
      - "ci/verify-build-context.sh"
      - "secureboot/trust-policies/**"
      - "build/build-kernel.sh"
      - "build/patches/nvidia-open-inline-sign.patch"
      - "ci/test-kernel-packaging-patch.sh"
      - "ci/test-swtpm-monotonic-state.sh"
      - "ci/test-gb10-console-boot.sh"
      # Le script qui nomme la machine rend AUSSI son profil réseau de secours :
      # sans lui, une appliance sur un lien sans DHCP n'a aucune adresse et
      # n'est joignable par aucun chemin (ICE-Fabric #447). Il n'était couvert
      # par aucune vérification de pull-request.
      - "image/mdns/**"
      - "ci/test-linklocal-fallback.sh"
      - "image/bootc-overlay/etc/systemd/system/neural-ice-dhcp-retry.service"
      - "image/bootc-overlay/etc/systemd/system/neural-ice-dhcp-retry.timer"
      - "image/Containerfile.bootc"
      - "image/bootc-overlay/etc/modules-load.d/nvidia.conf"
      - "image/bootc-overlay/etc/vconsole.conf"
      - "image/bootc-overlay/usr/lib/modprobe.d/90-neural-ice-nvidia-drm.conf"
      - ".github/workflows/build-kernel.yml"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/test-artifact-generation.yml"
  push:
    branches: [main]
    paths:
      - "image/lib/installer-ssh-key.sh"
