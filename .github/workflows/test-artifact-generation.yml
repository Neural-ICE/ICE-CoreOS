permissions:
  contents: read

jobs:
  test:
    # This job runs on a GitHub-hosted runner, so a fork's code never touches
    # Neural ICE infrastructure. The guard that used to skip fork pull requests
    # entirely is therefore removed: on an open-core repository it did not just
    # contain a risk, it denied external contributions any CI at all.
    # `pull_request` from a fork gets a read-only token and no secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Validate shell syntax
        run: |
          # 🔴 ENUMERATED FROM THE TREE, NOT FROM MEMORY (independent review
          # 2026-09-02, P2 #1). This list used to be hand-maintained and had
          # drifted: the sealed command-line grammar, the Live diagnostics
          # summary and two whole suites were in none of the workflow's three
          # lists. ci/test-suite-collection.sh now fails when any owned file is
          # missing from any of them, so this list cannot silently shrink again.
          # 🔴 image/lib/installer-payload.sh IS in this list as well as in the
          # POSIX one below. It is sourced by five bash files, and shellcheck can
          # only follow a `source` whose target it was also given -- omitting it
          # turns five files into SC1091 informational findings, and shellcheck
          # exits non-zero on those. Checked as bash here, as sh below.
          shellcheck ci/artifact-generation.sh ci/build-image.sh ci/canonicalize-vmlinuz.sh \
            ci/stage-artifacts.sh ci/stage-nvidia-userspace.sh ci/test-artifact-generation.sh \
            ci/test-build-image-dispatch-contract.sh ci/test-fabric-coreos-differential.sh ci/test-gb10-console-boot.sh ci/test-install-registry-mirror.sh \
            ci/test-kernel-packaging-patch.sh ci/test-linklocal-fallback.sh ci/test-no-shim-chained-updater.sh \
            ci/test-oci-signature-policy.sh ci/test-open-core-boundary.sh ci/test-open-core-workflow.sh \
            ci/run-media-validation.sh \
            ci/test-stage-nvidia-userspace.sh ci/test-suite-collection.sh ci/test-swtpm-monotonic-state.sh ci/test-swtpm-owner-ota-state.sh \
            ci/verify-build-context.sh image/build-installer-payload.sh image/build-installer-root.sh \
            image/build-installer-uki.sh image/build-installer-usb.sh image/build-preloaded.sh \
            image/build-seed-v2.sh image/firstboot/neural-ice-firstboot-sshkey.sh image/firstboot/neural-ice-seed-import.sh \
            image/firstboot/neural-ice-status-screen.sh image/installer/neural-ice-installer-failure.sh \
            image/installer/neural-ice-installer-runtime-generator.sh image/installer/neural-ice-live-diagnostics.sh image/installer/neural-ice-sealed-cmdline-grammar.sh \
            image/lib/access-policy.sh image/lib/hardware-identity.sh image/lib/installer-payload.sh image/lib/tpm2-nv-public.sh \
            image/lib/installer-ssh-key.sh image/lib/installer-trust.sh image/lib/preloaded-output-set.sh \
            image/lib/preloaded-sizing.sh image/lib/release-authorization.sh image/lib/signing-trust.sh \
            image/policy/render-container-policy.sh image/test-access-policy.sh image/test-build-installer-root.sh \
            image/test-hardware-identity.sh image/test-installer-failure-surface.sh image/test-installer-live-diagnostics.sh \
            image/test-installer-media.sh image/test-installer-payload.sh image/test-installer-selector-grammar.sh \
            image/test-installer-ssh-key.sh image/test-installer-systemd-lifecycle.sh image/test-installer-trust.sh \
            image/test-installer-uki.sh image/test-lib/sealed-medium-fixture.sh image/test-preloaded-output-set.sh \
            image/test-preloaded-sizing.sh image/qualify-installer-qemu.sh image/test-qualify-installer-qemu.sh \
            image/test-registry-authorisation.sh image/test-release-authorization.sh \
            image/test-seed-closure.sh image/test-seed-firstboot-import.sh image/test-signing-trust.sh image/test-status-screen.sh image/test-tpm-ceremony-systemd.sh \
            image/test-tpm-policy-initramfs.sh \
            image/test-verify-preloaded-media.sh ota/neural-ice-access-profile-anchor.sh ota/neural-ice-autoinstall.sh \
            ota/neural-ice-device-root-tpm.sh ota/neural-ice-firstboot-tpm-ceremony.sh ota/neural-ice-lab-baseline-handoff.sh \
            ota/neural-ice-tpm-policy-check.sh ota/neural-ice-tpm-state.sh ota/neural-ice-ota-tpm-state.sh ota/test-autoinstall-kargs.sh \
            ota/test-installer-pcr7-coverage.sh \
            ota/test-neural-ice-access-profile-anchor.sh ota/test-neural-ice-device-root-tpm.sh ota/test-neural-ice-lab-baseline-handoff.sh \
            ota/test-neural-ice-tpm-state.sh ota/test-neural-ice-ota-tpm-state.sh ota/test-tpm-signed-policy.sh
          # The initramfs hooks and the payload library are POSIX sh, on purpose:
          # they run in the initramfs /bin/sh AND are sourced by bash on the build
          # host and by the installer. Checking them as `sh` is what catches a
          # bashism that would only fail inside a signed UKI, on the appliance.
          shellcheck -s sh image/lib/installer-payload.sh image/lib/tpm2-nv-public.sh \
            image/initramfs/90neural-ice-installer-verity/neural-ice-installer-verity.sh \
            image/initramfs/90neural-ice-installer-verity/neural-ice-installer-verity-cmdline.sh \
            image/initramfs/91neural-ice-tpm-policy/module-setup.sh \
            image/initramfs/91neural-ice-tpm-policy/neural-ice-tpm-policy.sh

      - name: Validate every Python file this job owns
        run: |
          # Every Python file in the areas this job owns must at least PARSE, and
          # the ones with their own suites are exercised below. A file that only
          # ever ran on a build host is a file whose syntax error reaches a bench.
          python3 - <<'PY'
          import ast
          import pathlib
          import sys

          files = [
              "image/inspect-installer-media.py",
              "image/installer/neural-ice-registry-authorisation.py",
              "image/model-cache-contract.py",
              "image/seed-tree-manifest.py",
              "image/test-lib/unit-graph.py",
              "image/test-seed-tree-manifest.py",
              "image/verify-preloaded-media.py",
              "ota/neural-ice-luks-token-evidence.py",
              "ota/neural-ice-preseal-handoff.py",
              "ota/neural-ice-tpm-policy.py",
              "ota/test-neural-ice-luks-token-evidence.py",
              "ota/test-neural-ice-preseal-handoff.py",
          ]
          missing = [f for f in files if not pathlib.Path(f).is_file()]
          if missing:
              print(f"::error::this workflow names Python files that do not exist: {missing}")
              sys.exit(1)
          for name in files:
              try:
                  ast.parse(pathlib.Path(name).read_text(encoding="utf-8"), filename=name)
              except SyntaxError as error:
                  print(f"::error file={name},line={error.lineno}::{error.msg}")
                  sys.exit(1)
          print(f"parsed {len(files)} Python files")
          PY

      - name: Validate the installer image recipe
        run: |
          # A Containerfile has no linter here, so assert the properties that
          # actually broke. Each line below corresponds to a defect that reached
          # a build host on 2026-08-19.
          f=image/Containerfile.installer
          grep -q 'rm -rf /usr/lib/bootc/bound-images.d' "$f" \
            || { echo "::error::the installer must drop the appliance bound-image links, or bootc-image-builder cannot write the medium"; exit 1; }
          grep -q 'neural-ice-policy-strict.json' "$f" \
            || { echo "::error::the strict container policy must be preserved for the autoinstaller to restore onto the target"; exit 1; }
          grep -q "insecureAcceptAnything" "$f" \
            || { echo "::error::the medium must be able to read its own local image, or bootc install fails on every local transport"; exit 1; }
          grep -q 'neural-ice-policy-strict.json' ota/neural-ice-autoinstall.sh \
            || { echo "::error::the autoinstaller must restore the strict policy: the deployment is written from the medium's own image, so the permissive one would otherwise reach the appliance"; exit 1; }
          echo "installer recipe: every property that broke on 2026-08-19 is asserted"

      # 🔴 THE PRODUCTION TOOLCHAIN, INSTALLED RATHER THAN ASSUMED.
      #
      # This job used to run the UKI suite -- which mocks veritysetup, objcopy,
      # sbsign and an `sbverify` that always exits 0 -- without installing any of
      # them, and the release-authorization suite fell back to its openssl shim
      # because cosign was absent. So the whole signed-root architecture could be
      # broken and every check stayed green: a test that silently substitutes its
      # own tool is a gate that reports on a simulation.
      #
      # Every binary below is one a real medium build uses. `--version` on each
      # is deliberate: a package that installed but does not run is the same
      # green-while-guarding-nothing failure one step later.
      - name: Install the real signing, verity and media toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            skopeo cryptsetup-bin sbsigntool binutils mtools dosfstools gdisk \
            squashfs-tools tpm2-tools swtpm swtpm-tools openssl
          skopeo --version
          veritysetup --version
          sbsign --version
          sbverify --version
          objcopy --version | head -1
          mkfs.vfat --help 2>&1 | head -1
          mcopy -V 2>&1 | head -1
          sgdisk --version
          mksquashfs -version | head -1
          tpm2_getcap --version
          swtpm --version
          openssl version

      # cosign is the ONE signature stack this tree uses, and the appliance bakes
      # a pinned build of it (Containerfile.bootc §2b). Installing it here is what
      # stops the release-authorization suite quietly running against its openssl
      # shim -- which verifies the same ECDSA but proves nothing about cosign's
      # own argument handling, i.e. about the invocation the appliance performs.
      - name: Install the pinned cosign the appliance uses
        env:
          COSIGN_VERSION: 2.6.3
          COSIGN_SHA256_AMD64: 7c78a7f2efc00088bd788a758db6e0928e79f3e0eb83eb5d3c499ed98da4c4f4
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256_AMD64}  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Test artifact generation and kernel packaging contract
        run: |
          ./ci/test-artifact-generation.sh
          ./ci/test-stage-nvidia-userspace.sh
          ./ci/test-build-image-dispatch-contract.sh
          ./ci/test-open-core-boundary.sh
          ./ci/test-oci-signature-policy.sh
          ./ci/test-kernel-packaging-patch.sh
          ./ci/test-no-shim-chained-updater.sh
          ./ci/test-gb10-console-boot.sh
          ./ci/test-install-registry-mirror.sh
          ./ci/test-linklocal-fallback.sh
          # The P0 installer trust architecture, in dependency order: the sealed
          # anchor first (nothing below means anything without an authenticated
          # root), then what it authorises, then how the build produces it, then
          # what the appliance carries forward.
          ./image/test-access-policy.sh
          ./image/test-hardware-identity.sh
          ./image/test-signing-trust.sh
          ./image/test-installer-trust.sh
          ./image/test-release-authorization.sh
          ./image/test-build-installer-root.sh
          ./image/test-installer-payload.sh
          ./image/test-installer-uki.sh
          # The tty1 boot status screen: ungated by the ceremony on purpose, so its
          # own suite proves it cannot cycle, cannot read a secret, and shows the
          # stable NI-Exx failure codes (image/firstboot/status-error-codes.md).
          ./image/test-status-screen.sh
          # The one suite that uses the REAL toolchain end to end: real objcopy
          # assembles a real PE, real sbsign signs it, real sbverify verifies it,
          # and a real GPT medium with a real FAT ESP is read back WITHOUT root.
          # 🔴 THE VERITY-DEPENDENT SUITE MAY NOT SKIP HERE (independent review
          # 2026-09-02, P2 #1). image/test-lib/sealed-medium-fixture.sh `exit 0`s
          # when a tool is missing, so on a host without veritysetup this suite
          # printed `SKIP` and reported SUCCESS with nothing built or inspected.
          # NI_MEDIA_SUITE_REQUIRE_TOOLS=1 turns every such skip into a failure:
          # in CI the toolchain is installed above, so a skip here is a broken
          # runner, not an environment.
          if command -v veritysetup >/dev/null 2>&1; then
            NI_MEDIA_SUITE_REQUIRE_TOOLS=1 ./image/test-installer-media.sh
          else
            ./ci/run-media-validation.sh
          fi
          ./image/test-installer-systemd-lifecycle.sh
          # The three suites the systemd-lifecycle suite also chains, run here in
          # their own right so a change to that chaining cannot silently drop one.
          ./image/test-installer-selector-grammar.sh
          ./image/test-installer-live-diagnostics.sh
          ./image/test-installer-failure-surface.sh
          # The signed-media command-line grammar, the failure sink and the
          # container signature policy are the three things that decide what a
          # medium may do; the offline seed closure is what it may install.
          ./image/test-registry-authorisation.sh
          ./image/test-installer-ssh-key.sh
          sudo ./image/test-installer-ssh-key.sh --root-seam-negative-only
          ./image/test-tpm-policy-initramfs.sh
          sudo ./image/test-tpm-policy-initramfs.sh
          # The QEMU qualification harness grammar (arguments, refusals, expect/
          # reject contract) is offline; the harness itself runs only on the
          # KVM-capable GB10 host.
          ./image/test-qualify-installer-qemu.sh
          ./image/test-seed-firstboot-import.sh
          ./ota/test-autoinstall-kargs.sh
          ./ota/test-installer-pcr7-coverage.sh
          ./ota/test-neural-ice-tpm-state.sh
          ./ota/test-neural-ice-ota-tpm-state.sh
          ./ota/test-neural-ice-preseal-handoff.py
          ./ota/test-neural-ice-access-profile-anchor.sh
          # 🔴 AND THE THREE HAND-MAINTAINED LISTS ABOVE ARE CHECKED AGAINST THE
          # TREE. A file added with no wiring fails here rather than being
          # discovered by a reviewer months later.
          ./ci/test-suite-collection.sh

      # Producer/consumer wiring: the real producer must call its consumer both
      # before and after READY, and the legacy overlay interface must refuse.
      # Cryptographic and graph mutation coverage lives in the Rust verifier
      # suite, which consumes Fabric's generated canonical fixture.
      - name: Prove the offline seed closure end to end
        run: ./image/test-seed-closure.sh

      # 🔴 THE SUITES MUST NOT HAVE SUBSTITUTED THEIR OWN CRYPTO. Every suite
      # above reports which stack it used, and a run that fell back to a shim is
      # a run whose green means something weaker than it looks. Assert the
      # production stack was the one exercised.
      - name: Prove the suites ran against the production crypto, not a shim
        run: |
          set -euo pipefail
          out="$(./image/test-release-authorization.sh)"
          printf '%s\n' "$out"
          case "$out" in
            *"cosign=real"*) ;;
            *) echo "::error::the release-authorization suite fell back to its openssl shim; cosign is the appliance's only signature stack and CI must exercise it"; exit 1 ;;
          esac
          out="$(./ci/run-media-validation.sh 2>&1)"
          printf '%s\n' "$out"
          case "$out" in
            *"using the host's real veritysetup"*) ;;
            *) echo "::error::the media suite ran without a real veritysetup"; exit 1 ;;
          esac

      # swtpm is a REAL TPM 2.0 implementation, not a mock of one: the anchor and
      # high-water helpers below talk to it through the same tpm2-tools the
      # appliance uses. What it cannot prove is that a GB10's discrete TPM behaves
      # identically, or that the UKI boots — those need the hardware job named in
      # docs/ADR-0015, and this step says so out loud rather than implying
      # coverage it does not have.
      - name: Exercise the TPM helpers against a real software TPM
        run: |
          ./ci/test-swtpm-monotonic-state.sh
          ./ci/test-swtpm-owner-ota-state.sh
