---
name: test-preloaded-media

on:
  # Also on pull_request: this suite is what proves the debug medium can be
  # reached at all, and until now it only ran AFTER a merge to main -- so a
  # firstboot script that unmasks sshd without starting it reached main
  # unchallenged, and the defect surfaced on installed hardware instead.
  pull_request:
    paths:
      - 'image/build-preloaded.sh'
      - 'image/build-installer-usb.sh'
      - 'image/lib/installer-ssh-key.sh'
      - 'image/lib/access-policy.sh'
      - 'image/lib/preloaded-sizing.sh'
      - 'image/lib/preloaded-output-set.sh'
      - 'image/payload/neural-ice-payload-apply.service'
      - 'image/seed-tree-manifest.py'
      - 'image/test-preloaded-sizing.sh'
      - 'image/test-preloaded-output-set.sh'
      - 'image/test-installer-ssh-key.sh'
      - 'image/test-access-policy.sh'
      # The first-boot gate is the far end of the same chain the suite
      # exercises: the medium carries the key, this serves it. Leaving it out
      # means a change that silently stops serving the key triggers nothing.
      # The whole directory, because the gate is now a SCRIPT PLUS TWO UNITS and
      # the suite asserts the systemd ordering between them: a unit file edited
      # on its own is exactly the change that must re-run these tests.
      - 'image/firstboot/**'
      # The access policy is written by the image build and read by the
      # autoinstaller; a change to either end must re-run the gates.
      - 'image/Containerfile.bootc'
      - 'ota/neural-ice-autoinstall.sh'
      - 'image/verify-preloaded-media.py'
      # The final gate now runs the SEALED-CORE inspector on the finished raw
      # (review 2026-09-01, P1 #4), so the inspector, the shared medium fixture
      # and the facts the media build hands over are all part of this suite.
      - 'image/inspect-installer-media.py'
      - 'image/test-lib/**'
      - 'image/test-seed-tree-manifest.py'
      - 'image/test-verify-preloaded-media.sh'
      - '.github/workflows/test-preloaded-media.yml'
  push:
    branches:
      - main
    paths:
      - 'image/build-preloaded.sh'
      - 'image/build-installer-usb.sh'
      - 'image/lib/installer-ssh-key.sh'
      - 'image/lib/access-policy.sh'
      - 'image/lib/preloaded-sizing.sh'
      - 'image/lib/preloaded-output-set.sh'
      - 'image/payload/neural-ice-payload-apply.service'
      - 'image/seed-tree-manifest.py'
      - 'image/test-preloaded-sizing.sh'
      - 'image/test-preloaded-output-set.sh'
      - 'image/test-installer-ssh-key.sh'
      - 'image/test-access-policy.sh'
      # The first-boot gate is the far end of the same chain the suite
      # exercises: the medium carries the key, this serves it. Leaving it out
      # means a change that silently stops serving the key triggers nothing.
      # The whole directory, because the gate is now a SCRIPT PLUS TWO UNITS and
      # the suite asserts the systemd ordering between them: a unit file edited
      # on its own is exactly the change that must re-run these tests.
      - 'image/firstboot/**'
      # The access policy is written by the image build and read by the
      # autoinstaller; a change to either end must re-run the gates.
      - 'image/Containerfile.bootc'
      - 'ota/neural-ice-autoinstall.sh'
      - 'image/verify-preloaded-media.py'
      # The final gate now runs the SEALED-CORE inspector on the finished raw
      # (review 2026-09-01, P1 #4), so the inspector, the shared medium fixture
      # and the facts the media build hands over are all part of this suite.
      - 'image/inspect-installer-media.py'
      - 'image/test-lib/**'
      - 'image/test-seed-tree-manifest.py'
      - 'image/test-verify-preloaded-media.sh'
      - '.github/workflows/test-preloaded-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-preloaded-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-portable:
    # `github.ref == refs/heads/main` skipped every pull request, so widening the
    # trigger alone changed nothing -- the jobs still opted out. Keep the
    # repository guard (forks must not schedule our self-hosted runners) and
    # admit pull requests targeting main.
    if: >-
      github.repository == 'Neural-ICE/ICE-CoreOS'
      && (github.ref == 'refs/heads/main'
          || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Portable manifest tests
        run: |
          python3 -m py_compile \
            image/seed-tree-manifest.py \
            image/inspect-installer-media.py \
            image/verify-preloaded-media.py
          python3 image/test-seed-tree-manifest.py
          bash image/test-preloaded-sizing.sh
          bash image/test-preloaded-output-set.sh
          bash image/test-installer-ssh-key.sh
          bash image/test-access-policy.sh
          shellcheck \
            image/build-installer-usb.sh \
            image/build-preloaded.sh \
            image/lib/installer-ssh-key.sh \
            image/lib/access-policy.sh \
            image/lib/hardware-identity.sh \
            image/lib/installer-payload.sh \
            image/lib/installer-trust.sh \
            image/lib/release-authorization.sh \
            image/firstboot/neural-ice-firstboot-sshkey.sh \
            ota/neural-ice-autoinstall.sh \
            image/lib/preloaded-sizing.sh \
            image/lib/preloaded-output-set.sh \
            image/test-installer-ssh-key.sh \
            image/test-access-policy.sh \
            image/test-preloaded-sizing.sh \
            image/test-preloaded-output-set.sh \
            image/test-lib/sealed-medium-fixture.sh \
            image/test-verify-preloaded-media.sh
  linux-arm64:
    # `github.ref == refs/heads/main` skipped every pull request, so widening the
    # trigger alone changed nothing -- the jobs still opted out. Keep the
    # repository guard (forks must not schedule our self-hosted runners) and
    # admit pull requests targeting main.
    if: >-
      github.repository == 'Neural-ICE/ICE-CoreOS'
      && (github.ref == 'refs/heads/main'
          || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Portable manifest tests
        run: |
          python3 -m py_compile \
            image/seed-tree-manifest.py \
            image/inspect-installer-media.py \
            image/verify-preloaded-media.py
          python3 image/test-seed-tree-manifest.py
          bash image/test-preloaded-sizing.sh
          bash image/test-preloaded-output-set.sh
          bash image/test-installer-ssh-key.sh
          bash image/test-access-policy.sh
          shellcheck \
            image/build-installer-usb.sh \
            image/build-preloaded.sh \
            image/lib/installer-ssh-key.sh \
            image/lib/access-policy.sh \
            image/lib/hardware-identity.sh \
            image/lib/installer-payload.sh \
            image/lib/installer-trust.sh \
            image/lib/release-authorization.sh \
            image/firstboot/neural-ice-firstboot-sshkey.sh \
            ota/neural-ice-autoinstall.sh \
            image/lib/preloaded-sizing.sh \
            image/lib/preloaded-output-set.sh \
            image/test-installer-ssh-key.sh \
            image/test-access-policy.sh \
            image/test-preloaded-sizing.sh \
            image/test-preloaded-output-set.sh \
            image/test-lib/sealed-medium-fixture.sh \
            image/test-verify-preloaded-media.sh
      - name: Final raw-media integration
        if: github.event_name == 'push'
        run: >-
          sudo --non-interactive unshare --mount --propagation private --
          env PATH="$PATH" bash image/test-verify-preloaded-media.sh
