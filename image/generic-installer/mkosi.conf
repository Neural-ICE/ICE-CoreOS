# Generic Neural ICE installer: ONE UKI, built once per installer version, signed once
# (ADR-0044, Proposed). The host is NOT in here: it comes from the signed payload partition.
[Distribution]
Distribution=centos
Release=10
Architecture=arm64

[Output]
Format=uki
ImageId=ni-generic-installer
CompressOutput=zstd

[Content]
Bootable=yes
Bootloader=none
# Prototype: stock el10 kernel (QEMU virt). The GB10 build swaps in the host's nvidia-gb10 4k kernel RPMs
# (image/Containerfile.bootc step 1) so installer and host run the identical kernel and firmware.
Packages=
        kernel-core
        systemd
        systemd-udev
        systemd-boot-unsigned
        util-linux
        coreutils
        openssl
        jq
        dosfstools
        e2fsprogs
        cryptsetup
        tpm2-tools
KernelCommandLine=console=ttyAMA0 systemd.unit=ni-generic-installer.target systemd.firstboot=off
