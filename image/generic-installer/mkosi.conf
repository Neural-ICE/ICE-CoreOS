# Generic Neural ICE installer: ONE UKI, built once per installer version, signed once
# (ADR-0044, Accepted). The host is NOT in here: it comes from the signed payload partition.
# The kernel and the firmware are the host's (D5): build-uki.sh adds the staged GB10 kernel RPMs, the GSP
# firmware and the per-build seals through an --include file; nothing GB10-specific is guessed here.
[Distribution]
Distribution=centos
Release=10
Architecture=arm64

[Output]
Format=uki
ImageId=ni-generic-installer
CompressOutput=zstd

[Content]
Bootable=yes
Bootloader=none
Packages=
        systemd
        systemd-udev
        systemd-boot-unsigned
        util-linux
        coreutils
        kmod
        iproute
        openssl
        jq
        dosfstools
        e2fsprogs
        cryptsetup
        tpm2-tools
        podman
        skopeo
        python3
