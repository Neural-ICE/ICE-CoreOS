# The management link is held until device trust and the offline seed are
# published, then activated once; on the GX10 that first activation took 58 s
# (7 s DHCP, 51 s ip-check, .67, 2026-09-12) and nm-online's default 60 s made
# NetworkManager-wait-online the one "failed" unit of every first boot. Nothing
# waits on it that is not already gated; give it a budget the activation fits.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -s -q --timeout=300
