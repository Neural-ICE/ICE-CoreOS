[Unit]
# Shadow the baked first-boot unit on already-pinned appliance digests.
# Empty After= is supposed to drop After=systemd-tmpfiles-setup.service; do
# not add Before=tmpfiles/sysinit here — that self-cycles when the reset is
# ignored, which systemd 257 did on QEMU first boot.
DefaultDependencies=no
After=
After=local-fs.target
