# Neural ICE OTA verification config (ICE-Fabric OTA signing plan).
# Read by the on-device verifier `ni-ota-verify` before ANY update is applied.
# Format: key=value, one per line; lines starting with '#' are comments.

# 0 = shadow for non-authority rollout checks only; authenticity, signed bindings, target/ring, anti-rollback and bundle identity still refuse. 1 = enforce every failed check.
enforce=0

# TPM2 NV index holding the monotonic applied bundle sequence (anti-rollback counter; provisioned at first boot).
nv_index=0x01500001

# TPM2 NV EXTEND index anchoring the complete authority/applied/trusted-time
# state manifest. This is distinct from, and never replaces, the floor above.
state_nv_index=0x01500002

# Fetch-side artifact source. PRODUCT config, deliberately unset in the vanilla
# image and injected by the composer — same rule, and the same reason, as the
# ring/compat values at the bottom of this file.
#
# No component of this OS reads these three keys: `ni-ota-verify` ignores them by
# design (see the module header of tools/ni-ota-verify/src/config.rs — "the file
# also carries fetch-side settings … that belong to the OTA caller / later
# phases, not to this verifier"). Their only consumer is the OTA caller, which
# refuses to run when any of them is missing rather than guessing a source.
# Shipping them here put a specific product's endpoints in the open-core OS.
#
#registry=<registry-host>
#channel_ref=<org>/channels
#bundle_ref=<org>/bundles

# OTA root public key: verifies the bundle-manifest and channel-record signatures (the authoritative gate).
root_pubkey=/etc/neural-ice/keys/ota-root.pub

# Per-image signature verification (defense in depth under the root gate) is NOT
# implemented: no component of this repository, of the composer, or of the
# appliance reads an `image_pubkey` key, and the file it used to name was never
# shipped. The declaration is removed rather than left standing, because a
# config key that looks configured but is consumed by nobody reads as a control
# that exists. Restore it together with the code that honours it.

# Verifier runtime state (last verdict, applied-bundle record); created by tmpfiles.d (neural-ice-ota.conf).
state_dir=/var/lib/neural-ice/ota

# Device ring and compatibility are INSTANCE config, deliberately unset in the
# vanilla image. hardware_target is image-owned and must match the immutable marker
# in /usr/lib/neural-ice/hardware-target (ADR-0010).
# Missing ring/compat values warn in shadow and refuse in enforce mode.
#device_channel=stable
hardware_target=nvidia-gb10-arm64
#device_compat_min=1
#device_compat_max=3
